name: wallet_pro
description: Personal finance manager - accounts, budgets, loans, reports, voice entry, Google Drive backup.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  intl: ^0.19.0
  fl_chart: ^0.68.0
  flutter_colorpicker: ^1.1.0
  speech_to_text: ^7.0.0
  share_plus: ^10.0.2
  file_picker: ^8.1.2
  csv: ^6.0.0
  shared_preferences: ^2.3.2
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
