name: Build Wallet Pro APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.huzaifa --project-name wallet_pro .

      - name: Patch AndroidManifest (mic, internet, app name)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <queries><intent><action android:name="android.speech.RecognitionService"/></intent></queries>\n    <application|' $M
          sed -i 's|android:label="wallet_pro"|android:label="Wallet Pro"|' $M

      - name: Use persistent signing key (stable app identity)
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      - run: flutter pub get

      - run: flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: WalletPro-APK
          path: build/app/outputs/flutter-apk/app-release.apk
