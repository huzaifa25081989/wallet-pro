name: Build Wallet Pro APK

on:
  push:
    paths-ignore:
      - 'build_log.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.huzaifa --project-name wallet_pro .

      - name: Patch AndroidManifest (mic, internet, app name)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>\n    <queries><intent><action android:name="android.speech.RecognitionService"/></intent></queries>\n    <application|' $M
          sed -i 's|android:label="wallet_pro"|android:label="ProFinance"|' $M

      - name: Set Android compile/target SDK to 35 and drop default test
        run: |
          G=android/app/build.gradle
          sed -i 's|flutter.compileSdkVersion|35|g' $G
          sed -i 's|flutter.targetSdkVersion|35|g' $G
          sed -i 's|flutter.minSdkVersion|23|g' $G
          rm -f test/widget_test.dart
      - name: Configure Play release signing (upload key)
        run: |
          STOREPASS="${{ secrets.UPLOAD_STORE_PASSWORD }}"
          [ -z "$STOREPASS" ] && STOREPASS="ProFin_d33550fa25ea"
          cp signing/upload-keystore.jks android/upload-keystore.jks
          {
            echo "storePassword=$STOREPASS"
            echo "keyPassword=$STOREPASS"
            echo "keyAlias=upload"
            echo "storeFile=$GITHUB_WORKSPACE/android/upload-keystore.jks"
          } > android/key.properties
          python3 signing/patch_signing.py

      - name: Use persistent signing key (stable app identity)
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      - run: flutter pub get

      - name: Analyze and build (capture log)
        run: |
          set -o pipefail
          { echo "===== flutter analyze ====="; flutter analyze || true; \
            echo "===== flutter build apk ====="; \
            flutter build apk --release --no-tree-shake-icons \
              --build-name=1.0.$GITHUB_RUN_NUMBER --build-number=$GITHUB_RUN_NUMBER; \
            echo "===== flutter build appbundle ====="; \
            flutter build appbundle --release --no-tree-shake-icons \
              --build-name=1.0.$GITHUB_RUN_NUMBER --build-number=$GITHUB_RUN_NUMBER; } 2>&1 | tee build_log.txt

      - name: Save build log back to repo
        if: always()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f build_log.txt
          git commit -m "CI build log [skip ci]" || echo "nothing to commit"
          git push || echo "push failed"

      - uses: actions/upload-artifact@v4
        with:
          name: WalletPro-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Rename artifacts
        if: success()
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk WalletPro.apk
          cp build/app/outputs/bundle/release/app-release.aab ProFinance.aab

      - name: Publish APK as a Release (easy phone download)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Wallet Pro v1.0.${{ github.run_number }}
          body: |
            WalletPro.apk = sideload/testing build.
            ProFinance.aab = upload this to Google Play Console.
          files: |
            WalletPro.apk
            ProFinance.aab
